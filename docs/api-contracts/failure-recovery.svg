<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" font-family="Verdana, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="800" fill="#ffffff"/>
  <text x="550" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#5c1a2b">Tsa Temo Thuo — failure &amp; recovery: dropped connection, safe retry (QS-03, AC-05)</text>

  <!-- Lifeline headers -->
  <rect x="40" y="42" width="220" height="40" fill="#ffffff" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="150" y="66" text-anchor="middle" font-weight="bold" font-size="12">Buyer App</text>

  <rect x="440" y="42" width="220" height="40" fill="#ffffff" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="550" y="66" text-anchor="middle" font-weight="bold" font-size="12">Application Server (placeOrder)</text>

  <rect x="840" y="42" width="220" height="40" fill="#fdf6e3" stroke="#8a6d1a" stroke-width="1.5" rx="4"/>
  <text x="950" y="66" text-anchor="middle" font-weight="bold" font-size="12">Database (Order table)</text>

  <!-- Lifelines -->
  <line x1="150" y1="82" x2="150" y2="575" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="550" y1="82" x2="550" y2="575" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="950" y1="82" x2="950" y2="575" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Step 1 -->
  <text x="350" y="112" text-anchor="middle" font-size="10">POST /orders — Idempotency-Key: K1</text>
  <line x1="150" y1="122" x2="550" y2="122" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <text x="750" y="150" text-anchor="middle" font-size="10">findByIdempotencyToken(K1)</text>
  <line x1="550" y1="160" x2="950" y2="160" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Step 3: return -->
  <text x="750" y="188" text-anchor="middle" font-size="10">not found — continue to reserve + create</text>
  <line x1="950" y1="198" x2="550" y2="198" stroke="#666" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>

  <!-- Step 4 -->
  <text x="750" y="222" text-anchor="middle" font-size="10">reserve stock; create Order(idempotencyToken=K1)</text>
  <text x="750" y="236" text-anchor="middle" font-size="10">+ OrderStatusEvent — one transaction (ADR-001)</text>
  <line x1="550" y1="246" x2="950" y2="246" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Step 5: return -->
  <text x="750" y="270" text-anchor="middle" font-size="10">committed — orderId O1, reservedAt T1</text>
  <line x1="950" y1="280" x2="550" y2="280" stroke="#666" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>

  <!-- Step 6: response lost in transit -->
  <text x="460" y="304" text-anchor="middle" font-size="10">201 Created {orderId O1, reservedAt T1}</text>
  <line x1="550" y1="314" x2="390" y2="314" stroke="#b33322" stroke-width="1.4" stroke-dasharray="5,3"/>
  <line x1="378" y1="308" x2="390" y2="320" stroke="#b33322" stroke-width="2"/>
  <line x1="378" y1="320" x2="390" y2="308" stroke="#b33322" stroke-width="2"/>
  <text x="460" y="337" text-anchor="middle" font-size="10" fill="#b33322">connection drops here — the buyer app never receives this response</text>

  <!-- Separator: buyer retries -->
  <line x1="40" y1="365" x2="1060" y2="365" stroke="#999" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="550" y="384" text-anchor="middle" font-size="10" font-style="italic">Buyer app has no response and assumes the request may have failed.</text>
  <text x="550" y="398" text-anchor="middle" font-size="10" font-style="italic">It retries automatically, reusing the same Idempotency-Key (K1) — it never generates a new one.</text>

  <!-- Step 7: retry -->
  <text x="350" y="430" text-anchor="middle" font-size="10">POST /orders — Idempotency-Key: K1 (retry, same token)</text>
  <line x1="150" y1="440" x2="550" y2="440" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Step 8 -->
  <text x="750" y="468" text-anchor="middle" font-size="10">findByIdempotencyToken(K1)</text>
  <line x1="550" y1="478" x2="950" y2="478" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Step 9: return -->
  <text x="750" y="506" text-anchor="middle" font-size="10">found — Order O1 already committed, no new write</text>
  <line x1="950" y1="516" x2="550" y2="516" stroke="#666" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-return)"/>

  <!-- Step 10: return to buyer, this time it arrives -->
  <text x="350" y="544" text-anchor="middle" font-size="10">201 Created {orderId O1, reservedAt T1}</text>
  <line x1="550" y1="554" x2="150" y2="554" stroke="#1a6b3a" stroke-width="1.6" marker-end="url(#arrow-return)"/>
  <text x="350" y="570" text-anchor="middle" font-size="10" fill="#1a6b3a">same body as step 6 — the buyer cannot tell this apart from the original response</text>

  <!-- Annotation callout -->
  <rect x="60" y="600" width="980" height="60" fill="#f5eef0" stroke="#5c1a2b" stroke-width="1" rx="4"/>
  <text x="75" y="620" font-size="10" font-weight="bold">Why this is safe:</text>
  <text x="75" y="636" font-size="10">Steps 8–10 never re-run step 4. The idempotency lookup (step 8) finds the Order the first attempt already</text>
  <text x="75" y="650" font-size="10">committed and returns it unchanged — exactly one Order and one stock reservation ever exist for token K1 (AC-05, QS-03).</text>

  <!-- Secondary failure mode -->
  <rect x="60" y="680" width="980" height="100" fill="#ffffff" stroke="#999" stroke-width="1" rx="4"/>
  <text x="75" y="700" font-size="11" font-weight="bold">Secondary failure mode — external dependency unavailable</text>
  <text x="75" y="719" font-size="10">If the SMS Gateway or OpenRouteService stub is down or times out, it is called only after the transaction above has</text>
  <text x="75" y="733" font-size="10">already committed, and non-blocking (ADR-001; see models/deployment.svg). A failed notify/route call is logged and</text>
  <text x="75" y="747" font-size="10">retried out of band — it never rolls back or delays the Order that step 4 already made durable.</text>
  <text x="75" y="765" font-size="10" fill="#555">This is a materially different failure (an outbound call fails) from the primary scenario above (an inbound response is lost).</text>
</svg>
