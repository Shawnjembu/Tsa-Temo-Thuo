<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="Verdana, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="660" fill="#ffffff"/>
  <text x="550" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#5c1a2b">Tsa Temo Thuo — deployment view (Alternative A / ADR-001)</text>

  <!-- Boundary A: client devices, untrusted -->
  <rect x="40" y="45" width="640" height="150" fill="#f7f7f7" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3" rx="8"/>
  <text x="55" y="65" font-weight="bold" font-size="12">Client devices — public internet, untrusted</text>

  <rect x="60" y="85" width="140" height="70" fill="#ffffff" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="130" y="113" text-anchor="middle" font-size="11" font-weight="bold">Buyer app</text>
  <text x="130" y="129" text-anchor="middle" font-size="10">search / place order</text>

  <rect x="215" y="85" width="140" height="70" fill="#ffffff" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="285" y="113" text-anchor="middle" font-size="11" font-weight="bold">Farmer app</text>
  <text x="285" y="129" text-anchor="middle" font-size="10">list / confirm orders</text>

  <rect x="370" y="85" width="140" height="70" fill="#ffffff" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="440" y="113" text-anchor="middle" font-size="11" font-weight="bold">Transporter app</text>
  <text x="440" y="129" text-anchor="middle" font-size="10">accept / update jobs</text>

  <rect x="525" y="85" width="140" height="70" fill="#ffffff" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="595" y="113" text-anchor="middle" font-size="11" font-weight="bold">Admin console</text>
  <text x="595" y="129" text-anchor="middle" font-size="10">verify / reports</text>

  <!-- Label for the client->app-server fan, placed in clear space right of boundary A -->
  <text x="740" y="160" text-anchor="middle" font-size="10">HTTPS,</text>
  <text x="740" y="173" text-anchor="middle" font-size="10">authenticated</text>
  <text x="740" y="186" text-anchor="middle" font-size="10">(all 4 client apps)</text>

  <!-- Boundary B: trusted hosting environment -->
  <rect x="40" y="235" width="640" height="200" fill="#f5eef0" stroke="#5c1a2b" stroke-width="2" rx="8"/>
  <text x="55" y="255" font-weight="bold" font-size="12" fill="#5c1a2b">Application hosting environment — private network, trusted</text>

  <!-- Database node: placed on the left so notify/route arrows (app -> external, on the right)
       never have to cross it -->
  <rect x="65" y="275" width="260" height="120" fill="#fdf6e3" stroke="#8a6d1a" stroke-width="1.5" stroke-dasharray="6,3" rx="4"/>
  <text x="195" y="298" text-anchor="middle" font-weight="bold">Database node</text>
  <text x="195" y="315" text-anchor="middle" font-size="10">single relational store (ADR-001)</text>
  <text x="195" y="330" text-anchor="middle" font-size="10">Listings, Orders, OrderStatusEvents,</text>
  <text x="195" y="344" text-anchor="middle" font-size="10">registrations, report source data</text>
  <text x="195" y="361" text-anchor="middle" font-size="10" fill="#8a6d1a">not reachable from outside this boundary</text>

  <!-- Application server node: placed on the right, adjacent to the path out to external systems -->
  <rect x="355" y="275" width="260" height="120" fill="#ffffff" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="485" y="298" text-anchor="middle" font-weight="bold">Application server node</text>
  <text x="485" y="315" text-anchor="middle" font-size="10">Tsa Temo Thuo System</text>
  <text x="485" y="330" text-anchor="middle" font-size="10">(single deployable monolith —</text>
  <text x="485" y="344" text-anchor="middle" font-size="10">see models/component-architecture.svg)</text>
  <text x="485" y="361" text-anchor="middle" font-size="10">TLS terminates here</text>

  <!-- Boundary C: external stubbed systems -->
  <rect x="800" y="275" width="260" height="155" fill="#f7f7f7" stroke="#555" stroke-width="1.5" stroke-dasharray="6,3" rx="8"/>
  <text x="815" y="295" font-weight="bold" font-size="12">External systems — public internet, stubbed</text>
  <rect x="815" y="310" width="230" height="50" fill="#ffffff" stroke="#555" stroke-dasharray="4,2" rx="4"/>
  <text x="930" y="340" text-anchor="middle" font-size="11">SMS Gateway</text>
  <rect x="815" y="375" width="230" height="50" fill="#ffffff" stroke="#555" stroke-dasharray="4,2" rx="4"/>
  <text x="930" y="405" text-anchor="middle" font-size="11">OpenRouteService</text>

  <!-- Arrows: clients -> app server. Landing points are spread left-to-right in the same
       order as the client boxes above them, so none of the four lines cross. -->
  <line x1="130" y1="155" x2="380" y2="273" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="285" y1="155" x2="450" y2="273" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="440" y1="155" x2="520" y2="273" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="595" y1="155" x2="590" y2="273" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- App server -> DB: drawn low, below the two boxes' text, with its label underneath
       in the open strip of the boundary so neither overlaps box content -->
  <line x1="355" y1="385" x2="327" y2="385" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="341" y="408" text-anchor="middle" font-size="9">in-process — one local transaction (ADR-001)</text>

  <!-- App server -> external (dashed, crosses public internet again). Both lines start from the
       app server's right edge, which now has a clear run to boundary C without passing the DB box. -->
  <line x1="615" y1="300" x2="813" y2="325" stroke="#555" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <line x1="615" y1="360" x2="813" y2="395" stroke="#555" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="710" y="291" text-anchor="middle" font-size="10">public internet —</text>
  <text x="710" y="304" text-anchor="middle" font-size="10">notify (non-blocking)</text>
  <text x="710" y="418" text-anchor="middle" font-size="10">public internet — route info</text>

  <!-- Notes -->
  <rect x="40" y="460" width="1020" height="130" fill="none" stroke="#999" stroke-width="1"/>
  <text x="55" y="480" font-size="11" font-weight="bold">Notes</text>
  <text x="55" y="499" font-size="10">Two trust/network boundaries matter here: (1) client to application server — crosses the public internet, requires TLS and</text>
  <text x="55" y="513" font-size="10">authentication; (2) application server to database — stays inside one private network, never crosses a public boundary,</text>
  <text x="55" y="527" font-size="10">which is what makes the single ACID transaction in ADR-001 cheap to keep.</text>
  <text x="55" y="546" font-size="10">The application server is a single node for Phase 2 (ADR-001's modular monolith). It is the only component that can</text>
  <text x="55" y="560" font-size="10">read or write the database; clients and external stubs never reach the database node directly.</text>
  <text x="55" y="574" font-size="10">SMS Gateway and OpenRouteService calls leave the trusted boundary again, which is exactly why ADR-001 keeps them</text>
  <text x="55" y="588" font-size="10">non-blocking: a slow or failed external call cannot hold open the transaction that already committed the order.</text>
</svg>
