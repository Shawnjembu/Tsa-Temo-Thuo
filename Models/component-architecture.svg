<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Verdana, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#5c1a2b">Tsa Temo Thuo — component/module view, Alternative A (selected, ADR-001)</text>

  <!-- System boundary -->
  <rect x="40" y="45" width="630" height="440" fill="none" stroke="#5c1a2b" stroke-width="2" rx="8"/>
  <text x="55" y="66" font-weight="bold" fill="#5c1a2b" font-size="13">Tsa Temo Thuo System — single deployable</text>

  <!-- Buyer-facing UI -->
  <rect x="155" y="75" width="400" height="50" fill="#f5eef0" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="355" y="96" text-anchor="middle" font-weight="bold">Buyer-facing UI / API layer</text>
  <text x="355" y="113" text-anchor="middle" font-size="11">Search, order entry, idempotency-token generation</text>

  <!-- Application service -->
  <rect x="55" y="140" width="290" height="140" fill="#f5eef0" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="200" y="163" text-anchor="middle" font-weight="bold">Application /</text>
  <text x="200" y="180" text-anchor="middle" font-weight="bold">order-use-case service</text>
  <text x="200" y="205" text-anchor="middle" font-size="11">Validates request; opens ONE</text>
  <text x="200" y="221" text-anchor="middle" font-size="11">transaction covering the</text>
  <text x="200" y="237" text-anchor="middle" font-size="11">idempotency check, reserve,</text>
  <text x="200" y="253" text-anchor="middle" font-size="11">create and status event</text>

  <!-- Notification / Routing adapters, stacked to the right of the application service -->
  <rect x="390" y="140" width="275" height="60" fill="#ffffff" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="527" y="164" text-anchor="middle" font-size="12" font-weight="bold">Notification adapter (stub)</text>
  <text x="527" y="182" text-anchor="middle" font-size="10">called outside the commit path</text>

  <rect x="390" y="210" width="275" height="60" fill="#ffffff" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="527" y="234" text-anchor="middle" font-size="12" font-weight="bold">Routing adapter (stub)</text>
  <text x="527" y="252" text-anchor="middle" font-size="10">called outside the commit path</text>

  <!-- Four modules -->
  <rect x="55" y="300" width="150" height="65" fill="#ffffff" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="130" y="326" text-anchor="middle" font-weight="bold" font-size="12">Listing module</text>
  <text x="130" y="343" text-anchor="middle" font-size="10">reserveStock()</text>
  <text x="130" y="356" text-anchor="middle" font-size="10">restoreStock()</text>

  <rect x="215" y="300" width="150" height="65" fill="#ffffff" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="290" y="326" text-anchor="middle" font-weight="bold" font-size="12">Order module</text>
  <text x="290" y="343" text-anchor="middle" font-size="10">confirm() / decline()</text>
  <text x="290" y="356" text-anchor="middle" font-size="10">cancel() / expireReservation()</text>

  <rect x="375" y="300" width="150" height="65" fill="#ffffff" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="450" y="326" text-anchor="middle" font-weight="bold" font-size="12">TransportJob module</text>
  <text x="450" y="343" text-anchor="middle" font-size="10">accept()</text>
  <text x="450" y="356" text-anchor="middle" font-size="10">updateStatus()</text>

  <rect x="535" y="300" width="130" height="65" fill="#ffffff" stroke="#5c1a2b" stroke-width="1.5" rx="4"/>
  <text x="600" y="326" text-anchor="middle" font-weight="bold" font-size="11">Reporting module</text>
  <text x="600" y="343" text-anchor="middle" font-size="10">generateOrder-</text>
  <text x="600" y="356" text-anchor="middle" font-size="10">ActivityReport()</text>

  <!-- Persistence layer / transactional boundary -->
  <rect x="55" y="390" width="610" height="65" fill="#fdf6e3" stroke="#8a6d1a" stroke-width="1.5" stroke-dasharray="6,3" rx="4"/>
  <text x="360" y="412" text-anchor="middle" font-weight="bold">Persistence layer — single relational database</text>
  <text x="360" y="429" text-anchor="middle" font-size="11">Listings, Orders, OrderStatusEvents, registrations, report source data</text>
  <text x="360" y="445" text-anchor="middle" font-size="11" fill="#8a6d1a">Transactional (ACID) boundary — satisfies QS-01, QS-03, QS-09</text>

  <!-- External systems boundary -->
  <rect x="690" y="140" width="230" height="150" fill="#f7f7f7" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" rx="8"/>
  <text x="805" y="160" text-anchor="middle" font-weight="bold" font-size="12">External systems (stubbed)</text>
  <rect x="705" y="172" width="200" height="45" fill="#ffffff" stroke="#555" stroke-dasharray="4,2" rx="4"/>
  <text x="805" y="199" text-anchor="middle" font-size="11">SMS Gateway</text>
  <rect x="705" y="227" width="200" height="45" fill="#ffffff" stroke="#555" stroke-dasharray="4,2" rx="4"/>
  <text x="805" y="254" text-anchor="middle" font-size="11">OpenRouteService</text>

  <!-- Arrows: UI -> Application service -->
  <line x1="300" y1="125" x2="215" y2="138" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Application service -> adapters -->
  <line x1="345" y1="165" x2="388" y2="165" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="345" y1="240" x2="388" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Application service -> four modules -->
  <line x1="180" y1="280" x2="130" y2="298" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="280" x2="280" y2="298" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="280" x2="430" y2="298" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="280" x2="590" y2="298" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Modules -> persistence -->
  <line x1="130" y1="365" x2="130" y2="388" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="365" x2="290" y2="388" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="365" x2="450" y2="388" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="365" x2="600" y2="388" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Adapters -> external systems -->
  <line x1="665" y1="168" x2="703" y2="190" stroke="#555" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <line x1="665" y1="242" x2="703" y2="248" stroke="#555" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="505" width="630" height="60" fill="none" stroke="#999" stroke-width="1"/>
  <text x="55" y="525" font-size="11" font-weight="bold">Legend</text>
  <line x1="55" y1="542" x2="90" y2="542" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="98" y="546" font-size="10">in-process call (dependency direction)</text>
  <line x1="55" y1="558" x2="90" y2="558" stroke="#555" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="98" y="562" font-size="10">call across the system boundary to a stubbed external system</text>
</svg>
